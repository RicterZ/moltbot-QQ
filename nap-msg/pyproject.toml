[project]
name = "nap-msg"
version = "0.1.0"
description = "CLI tool for sending messages via Napcat WebSocket"
authors = [
    {name = "Ricter Z",email = "ricterzheng@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "yt-dlp>=2024.4.9",
    "pycryptodomex>=3.9.8",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
nap-msg = "nap_msg.cli:main"

[tool.poetry]
packages = [{include = "nap_msg"}]
